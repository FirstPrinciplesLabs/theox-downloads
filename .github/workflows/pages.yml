name: Deploy download site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Validate public release metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool release-manifest.json >/dev/null
          grep -q 'v0.1.0-preview.1' index.html
          grep -q '46a0461fa592249903245177b387ee3b222ac35d0b9f7ec3bd185d6080b1ec53' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
