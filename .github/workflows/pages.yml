name: Deploy download site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Validate public release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('release-manifest.json').read_text())
          page = Path('index.html').read_text()
          version = manifest['version']
          artifacts = manifest['artifacts']
          if not artifacts or f'/releases/tag/v{version}' not in page:
              raise SystemExit('The homepage does not match the release manifest')
          for artifact in artifacts:
              release_path = f'/releases/download/v{version}/{artifact["name"]}'
              if release_path not in page:
                  raise SystemExit(f'Missing download link: {artifact["name"]}')
              if len(artifact['sha256']) != 64:
                  raise SystemExit(f'Invalid SHA-256 digest: {artifact["name"]}')
          if artifacts[0]['sha256'] not in page:
              raise SystemExit('The featured download checksum does not match')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
